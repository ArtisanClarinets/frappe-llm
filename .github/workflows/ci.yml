name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements-rag.txt -r requirements-axolotl.txt -r requirements-eval.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Pytest
        env:
          HF_DATASETS_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -q
